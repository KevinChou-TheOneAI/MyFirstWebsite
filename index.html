<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI數位賦能工作坊 - 線上報名</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 16px;
            opacity: 0.95;
        }

        .form-container {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group label .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #c3e6cb;
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #667eea;
        }

        .info-box p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 640px) {
            .header h1 {
                font-size: 24px;
            }

            .form-container {
                padding: 30px 20px;
            }
        }

        /* 動畫效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI數位賦能工作坊</h1>
            <p>歡迎報名參加，開啟您的AI學習之旅</p>
        </div>

        <div class="form-container">
            <div class="success-message" id="successMessage">
                ✅ 報名成功！我們將盡快與您聯繫確認相關資訊。
            </div>

            <div class="info-box">
                <p>📌 請填寫以下資訊完成報名，所有欄位皆為必填項目。</p>
            </div>

            <form id="registrationForm">
                <div class="form-group">
                    <label for="department">部門單位 <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="department" 
                        name="department" 
                        placeholder="例如：資訊部、行銷部"
                        required
                    >
                    <div class="error-message" id="departmentError">請輸入部門單位</div>
                </div>

                <div class="form-group">
                    <label for="name">姓名 <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="請輸入您的姓名"
                        required
                    >
                    <div class="error-message" id="nameError">請輸入姓名</div>
                </div>

                <div class="form-group">
                    <label for="position">職稱 <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="position" 
                        name="position" 
                        placeholder="例如：專員、經理、主管"
                        required
                    >
                    <div class="error-message" id="positionError">請輸入職稱</div>
                </div>

                <div class="form-group">
                    <label for="email">電子信箱 <span class="required">*</span></label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="example@company.com"
                        required
                    >
                    <div class="error-message" id="emailError">請輸入有效的電子信箱</div>
                </div>

                <button type="submit" class="submit-btn">送出報名</button>
            </form>
        </div>
    </div>

    <script>
        // Google Apps Script Web App URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwI_BzE98C1y_Eb9S_rn7wboqkcf3JMMZEPOx93yv30MZeGPb5av-cZYffyaSX-eMLduQ/exec';
        
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 清除之前的錯誤訊息
            document.querySelectorAll('.error-message').forEach(msg => {
                msg.style.display = 'none';
            });

            // 驗證表單
            let isValid = true;
            const formData = {
                department: document.getElementById('department').value.trim(),
                name: document.getElementById('name').value.trim(),
                position: document.getElementById('position').value.trim(),
                email: document.getElementById('email').value.trim(),
                registrationTime: new Date().toISOString() // 後台自動記錄報名時間
            };

            // 驗證各欄位
            if (!formData.department) {
                document.getElementById('departmentError').style.display = 'block';
                isValid = false;
            }

            if (!formData.name) {
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            }

            if (!formData.position) {
                document.getElementById('positionError').style.display = 'block';
                isValid = false;
            }

            // 驗證電子信箱格式
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!formData.email || !emailRegex.test(formData.email)) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }

            if (isValid) {
                // 顯示載入狀態
                const submitBtn = document.querySelector('.submit-btn');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = '送出中...';
                submitBtn.disabled = true;
                
                // 發送資料到 Google Apps Script
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                })
                .then(() => {
                    // 因為 no-cors 模式，我們假設請求成功
                    // 顯示成功訊息
                    document.getElementById('successMessage').style.display = 'block';
                    
                    // 輸出表單資料到控制台
                    console.log('報名資料：', formData);
                    
                    // 重置表單和按鈕
                    setTimeout(() => {
                        document.getElementById('registrationForm').reset();
                        document.getElementById('successMessage').style.display = 'none';
                        submitBtn.textContent = originalText;
                        submitBtn.disabled = false;
                    }, 3000);

                    // 捲動到頂部顯示成功訊息
                    document.querySelector('.container').scrollIntoView({ behavior: 'smooth' });
                })
                .catch(error => {
                    console.error('錯誤:', error);
                    alert('報名時發生錯誤，請稍後再試或聯繫管理員。');
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                });
            }
        });
    </script>
</body>
</html>
